name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tww3
          POSTGRES_PASSWORD: tww3
          POSTGRES_DB: tww3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tww3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tww3:tww3@localhost:5432/tww3?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-replace-me-with-at-least-32-chars-long-string
      JWT_COOKIE_NAME: auth_token
      JWT_COOKIE_DOMAIN: localhost
      JWT_EXPIRES_IN: "604800"
      DISCORD_CLIENT_ID: mock
      DISCORD_CLIENT_SECRET: mock
      DISCORD_REDIRECT_URI: http://localhost:3000/auth/discord/callback
      DISCORD_SCOPES: "identify email"
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate deploy
        run: pnpm --filter @tww3/db exec prisma migrate deploy

      - name: Prisma generate
        run: pnpm --filter @tww3/db exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
