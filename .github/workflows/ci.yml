name: CI

on:
  push:
    branches: [main]
    # Docs-only commits don't affect the build/test/deploy artifacts, so skip
    # the full Postgres+Redis+Playwright run (and the downstream deploy) for
    # them. '**.md' already covers ROADMAP.md, DEPLOYMENT.md and CLAUDE.md.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.knowledge/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.knowledge/**'
      - '.claude/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tww3
          POSTGRES_PASSWORD: tww3
          POSTGRES_DB: tww3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tww3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tww3:tww3@localhost:5432/tww3?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-replace-me-with-at-least-32-chars-long-string
      JWT_COOKIE_NAME: auth_token
      JWT_COOKIE_DOMAIN: localhost
      JWT_EXPIRES_IN: "604800"
      DISCORD_CLIENT_ID: mock
      DISCORD_CLIENT_SECRET: mock
      DISCORD_REDIRECT_URI: http://localhost:3000/auth/discord/callback
      DISCORD_SCOPES: "identify email"
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate deploy
        run: pnpm --filter @rizzotto/db exec prisma migrate deploy

      - name: Prisma generate
        run: pnpm --filter @rizzotto/db exec prisma generate

      - name: Seed factions and default season
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        # On a cache hit the browser binary (~120 MB) is restored, so only the
        # OS-level libs need installing. On a miss, do the full download.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter @rizzotto/e2e exec playwright install-deps chromium
          else
            pnpm --filter @rizzotto/e2e exec playwright install --with-deps chromium
          fi

      - name: E2E (Playwright)
        # Blocking pre-deploy gate. Visual-snapshot tests run unconditionally;
        # Linux baseline PNGs are committed (PR #9, a31cf49). Volatile sections
        # (leaderboard table, Roll of Honour list) are masked via data-testid
        # locators in tests/visual/landing-overhaul.spec.ts.
        run: pnpm --filter @rizzotto/e2e test:e2e
        env:
          NODE_ENV: test
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
