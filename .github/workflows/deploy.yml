name: Deploy

# Triggers immediately on push to main — CI runs in parallel as a quality
# signal but no longer gates the deploy. workflow_dispatch remains as a
# manual re-deploy escape hatch.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.knowledge/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    environment:
      name: production
      url: https://rizzotto.gg

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key from ssh-keyscan 2026-05-20. Update if the host's
          # SSH key ever rotates (very rare for a long-lived VM).
          cat <<'HOSTKEYS' >> ~/.ssh/known_hosts
          ${{ secrets.DEPLOY_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHW6BB91rA//kZOygO+AiG5INXy4W7GkIc84nqlcZMz5
          HOSTKEYS
          chmod 600 ~/.ssh/known_hosts

      - name: Run deploy.sh on production host
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'cd /home/deploy/rizzotto && bash scripts/deploy.sh'

      - name: Smoke-test production
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' https://rizzotto.gg)
          if [ "$status" != "200" ]; then
            echo "::error::Post-deploy smoke failed: rizzotto.gg returned $status"
            exit 1
          fi
          echo "rizzotto.gg → $status"

      # Fires if any prior step failed (SSH OR smoke-test). Silent skip when
      # the webhook secret is not set, so forks and bootstrap runs don't error.
      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_DISCORD_WEBHOOK }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DEPLOY_DISCORD_WEBHOOK not set — skipping notify"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          payload=$(jq -nc \
            --arg branch "$BRANCH" \
            --arg sha "$SHORT_SHA" \
            --arg run "$RUN_URL" \
            '{
              embeds: [{
                title: "Deploy FAILED — rizzotto.gg",
                color: 15158332,
                fields: [
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: "`\($sha)`", inline: true },
                  { name: "Run", value: "[Open in Actions](\($run))", inline: false }
                ]
              }]
            }')
          curl -sS -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"
